<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#04060d"/>
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="radialGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="2.5"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#radialGlow)"/>

  <!-- Architectural 'P' Monogram -->
  <!-- Stem -->
  <rect x="18" y="15" width="7" height="34" rx="3.5" fill="url(#cyanGrad)"/>

  <!-- Loop of P -->
  <path d="M22 15H36C43.1797 15 48 19.8203 48 26.5C48 33.1797 43.1797 38 36 38H22" stroke="url(#cyanGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner High-Tech Vertex Node -->
  <circle cx="34" cy="26.5" r="3" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="48" cy="46" r="2.5" fill="#38bdf8"/>
</svg>
